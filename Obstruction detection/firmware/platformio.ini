; PlatformIO project for the harbour lane signaller firmware.
;
; Board: ESP32-C3 Super Mini. PlatformIO has no dedicated Super Mini entry;
; esp32-c3-devkitm-1 is the standard C3 definition and matches the silicon
; (RISC-V ESP32-C3, 4 MB flash).
;
; The two build flags are the PlatformIO equivalent of the Arduino IDE's
; "USB CDC On Boot: Enabled". Without them Serial goes nowhere on a C3: the
; sketch's Serial would target a hardware UART instead of the native USB the
; board is actually plugged into, and the whole '0'/'1'/'2'/'3' protocol
; would silently do nothing.
;
;   ARDUINO_USB_MODE=1         use the built-in USB-Serial-JTAG peripheral
;   ARDUINO_USB_CDC_ON_BOOT=1  map Serial onto that USB interface at boot

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
