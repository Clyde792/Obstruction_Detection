<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lane Monitor</title>
<style>
/* Palette is deliberately NOT pure red/green. A standard status green vs red
   pair measures ~4.1 perceptual distance under deuteranopia -- effectively
   indistinguishable. Shifting green toward teal raises that to ~12.8 while
   still reading unmistakably as "green" to normal vision. The ESP32's actual
   LEDs stay red/green; only the screen compensates.

   Retuned, same reasoning: the page/panel steps were darkened and separated
   so the three status hues sit on a quieter ground and win the eye by
   themselves rather than competing with panel chrome. Hue angles are
   unchanged (teal / amber / red-orange), only chroma and lightness moved. */
:root{
  /* surfaces: 4 steps, each a clear stop -- page < panel < raised < inset */
  --page:#070A0F; --panel:#0F151E; --raised:#151D28; --inset:#0A0F16;
  --border:#232E3D; --border-soft:#19212C; --border-strong:#31404F;

  /* text: 4 steps, used strictly by rank -- primary value, label, muted */
  --text:#EAEFF6; --text-2:#9CAABE; --text-mute:#65727F;

  /* status. --blocked is the single most saturated thing on the page, on
     purpose: nothing else is allowed to compete with it. */
  --clear:#12D18C; --confirm:#FFB020; --blocked:#FF4438; --info:#5B9DFF;

  /* spacing: 4px base, no in-between values anywhere */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;

  /* type scale */
  --fs-micro:10px; --fs-lbl:11px; --fs-sm:12px; --fs-base:13px;
  --fs-md:15px; --fs-lg:18px; --fs-xl:22px;

  --r-chip:7px; --r-inner:9px; --r-card:13px; --r-pill:999px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;

  /* one shared easing + duration so every transition on the page agrees */
  --ease:cubic-bezier(.2,.7,.3,1); --dur:150ms;

  /* minimum comfortable hit target; raised on coarse pointers further down */
  --hit:38px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--text); font-family:var(--font);
  font-size:var(--fs-base); line-height:1.45; -webkit-font-smoothing:antialiased;
  display:grid; gap:var(--sp-3); padding:var(--sp-3);
  grid-template-columns:minmax(0,3fr) minmax(380px,1.35fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "safety safety" "alert alert" "feed side" "diag diag";
  overflow:hidden;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card)}
/* the single label style used for every field name on the page */
.lbl{font-size:var(--fs-lbl); font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--text-mute)}
.spacer{flex:1}

/* ---------- header ---------- */
header{grid-area:head; display:flex; align-items:center; gap:var(--sp-4);
  padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4);
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card);
  flex-wrap:wrap; row-gap:var(--sp-2)}
header h1{font-size:var(--fs-base); font-weight:800; letter-spacing:.13em; margin:0;
  display:flex; align-items:center; gap:var(--sp-2); white-space:nowrap;
  padding-right:var(--sp-4); border-right:1px solid var(--border-soft)}
header h1 svg{width:19px;height:19px;color:var(--info)}
/* One flat wrapping row of chips. Deliberately NOT nested chip groups: a
   wrap inside a wrapped flex item let a single chip orphan onto a line the
   header's own height didn't account for, so it rendered outside the header
   box. A plain divider element separates the two clusters instead -- what
   the system reports, then what this browser controls. */
.chipbar{flex:1 1 auto; min-width:0; display:flex; flex-wrap:wrap;
  align-items:center; justify-content:flex-end; gap:6px}
.chipdiv{flex:none; width:1px; align-self:stretch; min-height:22px;
  background:var(--border-soft); margin:0 var(--sp-2)}

.chip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px;
  border-radius:var(--r-pill); background:var(--inset); border:1px solid var(--border);
  font-family:var(--font); font-size:var(--fs-sm); font-weight:650; letter-spacing:.01em;
  color:var(--text-2); white-space:nowrap;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease),
             color var(--dur) var(--ease)}
.chip svg{width:14px;height:14px;flex:none}
/* NOTE: render() assigns className="chip on|off|warn" wholesale, wiping any
   extra class. All per-chip styling therefore hangs off #id, never a class. */
.chip.on{color:var(--clear); border-color:color-mix(in oklab,var(--clear) 40%,var(--border));
  background:color-mix(in oklab,var(--clear) 7%,var(--inset))}
.chip.off{color:var(--text-mute)}
.chip.warn{color:var(--confirm); border-color:color-mix(in oklab,var(--confirm) 48%,var(--border));
  background:color-mix(in oklab,var(--confirm) 9%,var(--inset))}
#chipMute{cursor:pointer}
#chipMute:hover,button.chip:hover{border-color:var(--border-strong); color:var(--text)}
button.chip{cursor:pointer}
button.chip:active{transform:translateY(1px)}
.chip:focus-visible{outline:2px solid var(--info); outline-offset:2px}
#chipCal{color:var(--info); border-color:color-mix(in oklab,var(--info) 50%,var(--border));
  background:color-mix(in oklab,var(--info) 10%,var(--inset))}

/* ---------- safety banners: supervisor notify + person-in-lane alarm ----------
   These sit directly under the header, above everything else including the
   informational band, and are the only elements on the page allowed a
   full-width footprint at this size. Ranked against each other too: the
   supervisor notice is amber and static, the person alarm is red, larger,
   and flashing, and it also escalates the whole page (see #pageAlert). */
#safety{grid-area:safety; display:flex; flex-direction:column; gap:var(--sp-2)}
.safety-banner{display:none; align-items:center; gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-4); border-radius:var(--r-inner);
  border:1px solid; font-size:var(--fs-md); line-height:1.35}
.safety-banner.show{display:flex}
.safety-banner svg{width:26px;height:26px;flex:none}
.safety-banner b{color:var(--text); font-weight:800; letter-spacing:.04em}
#alertSupervisor{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--confirm) 22%,var(--panel)),
    color-mix(in oklab,var(--confirm) 11%,var(--panel)));
  border-color:color-mix(in oklab,var(--confirm) 55%,var(--border));
  border-left:5px solid var(--confirm); color:var(--text-2)}
#alertSupervisor svg{color:var(--confirm)}
#alertPerson{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--blocked) 32%,var(--panel)),
    color-mix(in oklab,var(--blocked) 15%,var(--panel)));
  border-color:color-mix(in oklab,var(--blocked) 62%,var(--border));
  border-left:5px solid var(--blocked); color:var(--text);
  font-size:var(--fs-lg); font-weight:600; padding:var(--sp-4);
  animation:safetyFlash 1s step-start infinite}
#alertPerson svg{color:var(--blocked); width:30px;height:30px}
@keyframes safetyFlash{50%{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--blocked) 52%,var(--panel)),
    color-mix(in oklab,var(--blocked) 26%,var(--panel)))}}

/* ---------- page-level escalation ----------
   Purely decorative overlay, driven entirely by :has() off the same .show /
   data-state hooks the existing JS already toggles -- no new JS state, no new
   element for the script to know about. A blocked lane rims the page; a
   person on a blocked lane rims it harder and flashes, so the alarm is
   unmissable from across the room even if the operator is scrolled into
   the Advanced section. */
#pageAlert{position:fixed; inset:0; z-index:40; pointer-events:none; display:none}
body:has(.lane[data-state=blocked]) #pageAlert{display:block;
  box-shadow:inset 0 0 0 3px color-mix(in oklab,var(--blocked) 62%,transparent),
             inset 0 0 70px -26px color-mix(in oklab,var(--blocked) 55%,transparent)}
body:has(#alertPerson.show) #pageAlert{display:block;
  box-shadow:inset 0 0 0 6px var(--blocked),
             inset 0 0 120px -20px color-mix(in oklab,var(--blocked) 72%,transparent);
  animation:pageFlash 1s step-start infinite}
@keyframes pageFlash{50%{
  box-shadow:inset 0 0 0 6px color-mix(in oklab,var(--blocked) 55%,transparent),
             inset 0 0 120px -30px color-mix(in oklab,var(--blocked) 45%,transparent)}}

/* ---------- informational band (subordinate to the safety banners) ---------- */
#alert{grid-area:alert; display:none; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4); border-radius:var(--r-inner);
  background:var(--panel); border:1px solid var(--border);
  border-left:3px solid var(--confirm);
  font-size:var(--fs-base); color:var(--text-2)}
#alert.show{display:flex}
#alert svg{width:18px;height:18px;color:var(--confirm);flex:none}
#alert b{color:var(--text); font-weight:700}

/* ---------- feed ---------- */
.feed{grid-area:feed; position:relative; background:#000; border-radius:var(--r-card);
  border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center}
.feed img{width:100%;height:100%;object-fit:contain;display:block}
/* canvas is a replaced element with an intrinsic 300x150 default size --
   inset:0 alone does NOT stretch it to fill an absolutely positioned parent
   the way it would a <div>. Without explicit width/height it sits in the
   top-left corner, so clicks anywhere else on the video hit nothing. */
#calibLayer{position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; display:none}
#calibLayer.on{display:block}
#feedLost{position:absolute; inset:0; display:none; flex-direction:column; gap:var(--sp-3);
  align-items:center; justify-content:center; background:var(--inset); color:var(--info);
  font-weight:800; font-size:var(--fs-md); letter-spacing:.16em}
#feedLost.show{display:flex}
#feedLost svg{width:44px;height:44px}
.feedbar{position:absolute; left:0; right:0; bottom:0; display:flex; gap:var(--sp-2);
  padding:var(--sp-3); align-items:center;
  background:linear-gradient(transparent,rgba(7,10,15,.94))}

/* ---------- side column ---------- */
.side{grid-area:side; display:flex; flex-direction:column; gap:var(--sp-3);
  min-height:0; overflow-y:auto; padding-right:2px; scrollbar-width:thin;
  scrollbar-color:var(--border) transparent}
.side::-webkit-scrollbar{width:9px}
.side::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;
  border:2px solid var(--page)}
.side::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}

/* ---------- lane cards: the primary object on the page ---------- */
.lane{position:relative; padding:var(--sp-4); border-radius:var(--r-card);
  border:1px solid color-mix(in oklab,var(--state) 26%,var(--border));
  border-left:5px solid var(--state);
  background:
    linear-gradient(160deg,
      color-mix(in oklab,var(--state) 11%,var(--panel)),
      color-mix(in oklab,var(--state) 3%,var(--panel)) 62%);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease)}
.lane[data-state=clear]{--state:var(--clear)}
.lane[data-state=confirming]{--state:var(--confirm)}
/* blocked transitions instantly -- an easing curve on the most urgent state
   change on the page is 160ms of the operator seeing the wrong thing */
.lane[data-state=blocked]{--state:var(--blocked); transition-duration:0ms;
  box-shadow:0 0 0 1px var(--blocked),
             0 0 40px -10px color-mix(in oklab,var(--blocked) 72%,transparent)}

.lane-top{display:flex; align-items:center; gap:var(--sp-3)}
/* the icon sits in its own tinted well, so the state reads as a deliberate
   badge rather than a loose glyph floating next to text */
.lane-badge{flex:none; width:46px; height:46px; border-radius:var(--r-inner);
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in oklab,var(--state) 15%,var(--inset));
  border:1px solid color-mix(in oklab,var(--state) 34%,var(--border))}
.lane-icon{width:26px;height:26px;color:var(--state)}
.lane-id{display:flex; flex-direction:column; gap:2px; min-width:0}
.lane-name{font-size:var(--fs-lbl); font-weight:700; letter-spacing:.16em; color:var(--text-2)}
.lane-state{font-size:clamp(26px,2.5vw,36px); font-weight:800; letter-spacing:-.005em;
  line-height:1; color:var(--state)}
@keyframes pulse{50%{opacity:.4}}
.lane[data-state=confirming] .lane-icon{animation:pulse 1.1s ease-in-out infinite}
.ovr{margin-left:auto; align-self:flex-start; font-size:var(--fs-micro); font-weight:800;
  letter-spacing:.08em; padding:5px 9px; border-radius:var(--r-chip);
  background:var(--blocked); color:var(--page); white-space:nowrap}
.ovr.green{background:var(--info)}

.meter{margin-top:var(--sp-4)}
.meter-head{display:flex; justify-content:space-between; align-items:baseline;
  gap:var(--sp-3); margin-bottom:7px}
/* the countdown is the number an operator actually watches -- give it the
   largest non-headline size in the card */
.meter-head .v{font-size:var(--fs-lg); font-weight:650; color:var(--text); line-height:1}
.track{position:relative; height:16px; border-radius:8px; background:var(--inset);
  box-shadow:inset 0 0 0 1px var(--border-soft); overflow:hidden}
.fill{height:100%; background:var(--state); border-radius:8px;
  transition:width 120ms linear}
.ticks{position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),
    color-mix(in oklab,var(--page) 70%,transparent) calc(12.5% - 1px) 12.5%)}
.release{position:absolute; top:-3px; bottom:-3px; width:2px;
  background:var(--text); border-radius:1px;
  box-shadow:0 0 0 1px color-mix(in oklab,var(--page) 80%,transparent)}
.track2{margin-top:var(--sp-3); height:7px; border-radius:4px; background:var(--inset);
  box-shadow:inset 0 0 0 1px var(--border-soft); overflow:hidden}
.fill2{height:100%; background:var(--text-2); border-radius:4px; transition:width 160ms var(--ease)}
.meter-foot{display:flex; justify-content:space-between; gap:var(--sp-3);
  margin-top:6px; font-size:var(--fs-lbl); color:var(--text-mute)}

/* ---------- segmented override control ---------- */
.lane-actions{display:flex; gap:6px; margin-top:var(--sp-4)}
.seg{display:flex; background:var(--inset); border:1px solid var(--border);
  border-radius:var(--r-inner); overflow:hidden; flex:1}
.seg button{flex:1; min-height:var(--hit); background:none; border:0;
  color:var(--text-2); font-family:var(--font); font-size:var(--fs-lbl); font-weight:750;
  letter-spacing:.06em; padding:8px 4px; cursor:pointer; white-space:nowrap;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease)}
.seg button+button{border-left:1px solid var(--border-soft)}
.seg button:hover{background:var(--raised); color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--info); outline-offset:-2px; z-index:1}
.seg button.sel{background:var(--text-2); color:var(--page)}
.seg button.sel[data-mode=red]{background:var(--blocked); color:var(--page)}
.seg button.sel[data-mode=green]{background:var(--info); color:var(--page)}

/* ---------- sections ---------- */
.sect{padding:var(--sp-4)}
.sect h2{font-size:var(--fs-lbl); font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--text-mute); margin:0 0 var(--sp-3)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2)}
.stack{display:flex; flex-direction:column; gap:var(--sp-2)}

/* ---------- Advanced disclosure ----------
   Everything setup-time or diagnostic (calibration, recovery, pipeline
   toggles, tuning sliders, the event log) lives here, collapsed by default,
   so the default view is just the video and the two lane cards -- what's
   actually watched during a live demo. Nothing is removed, only deferred
   one click. Native <details>/<summary>: free keyboard/a11y support, no JS. */
details.adv{padding:0}
details.adv summary{list-style:none; cursor:pointer; min-height:var(--hit);
  padding:var(--sp-3) var(--sp-4); display:flex; align-items:center; gap:var(--sp-2);
  font-size:var(--fs-lbl); font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-mute); border-radius:var(--r-card);
  transition:color var(--dur) var(--ease), background var(--dur) var(--ease)}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary svg{width:14px;height:14px}
details.adv summary::after{content:""; margin-left:auto; width:7px; height:7px;
  border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translate(-1px,-1px);
  transition:transform var(--dur) var(--ease)}
details.adv[open] summary{color:var(--text-2); border-radius:var(--r-card) var(--r-card) 0 0}
details.adv[open] summary::after{transform:rotate(-135deg)}
details.adv summary:hover{color:var(--text); background:var(--raised)}
details.adv summary:focus-visible{outline:2px solid var(--info); outline-offset:-2px}
details.adv .advBody{border-top:1px solid var(--border-soft)}
details.adv .advBody .sect+.sect{border-top:1px solid var(--border-soft)}

button.act{display:flex; align-items:center; gap:var(--sp-3); width:100%;
  min-height:var(--hit); text-align:left; padding:9px var(--sp-3);
  border-radius:var(--r-inner); border:1px solid var(--border);
  background:var(--inset); color:var(--text); font-family:var(--font);
  font-size:var(--fs-base); font-weight:600; cursor:pointer;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease)}
button.act svg{width:16px;height:16px;color:var(--text-2);flex:none;
  transition:color var(--dur) var(--ease)}
button.act:hover{background:var(--raised); border-color:var(--border-strong)}
button.act:hover svg{color:var(--text)}
button.act:active{transform:translateY(1px)}
button.act.danger{border-color:color-mix(in oklab,var(--blocked) 42%,var(--border))}
button.act.danger svg{color:var(--blocked)}
button.act.danger:hover{background:color-mix(in oklab,var(--blocked) 12%,var(--inset));
  border-color:var(--blocked)}
button.act.danger:hover svg{color:var(--blocked)}
button.act.primary{border-color:color-mix(in oklab,var(--info) 46%,var(--border))}
button.act.primary svg{color:var(--info)}
button.act.primary:hover{background:color-mix(in oklab,var(--info) 12%,var(--inset));
  border-color:var(--info)}
button.act.primary:hover svg{color:var(--info)}
button.act:focus-visible{outline:2px solid var(--info); outline-offset:2px}

.tog{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  min-height:var(--hit); padding:8px var(--sp-3); border-radius:var(--r-inner);
  background:var(--inset); border:1px solid var(--border);
  font-size:var(--fs-base); cursor:pointer; margin-bottom:6px; color:var(--text-2);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             color var(--dur) var(--ease)}
.tog:hover{background:var(--raised); border-color:var(--border-strong); color:var(--text)}
.tog.on{color:var(--text)}
.tog .sw{flex:none; width:36px; height:20px; border-radius:var(--r-pill);
  background:var(--border); position:relative;
  transition:background var(--dur) var(--ease)}
.tog .sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--text-mute);
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease)}
.tog.on .sw{background:color-mix(in oklab,var(--info) 50%,var(--inset))}
.tog.on .sw::after{transform:translateX(16px); background:var(--info)}

.slider{margin-bottom:var(--sp-4)}
.slider:last-child{margin-bottom:0}
/* labels here are long enough to wrap in a narrow side column, so the row
   aligns on its last line and reserves real space below it -- baseline
   alignment let a two-line label collide with the track underneath */
.slider .row{display:flex; justify-content:space-between; align-items:flex-end;
  gap:var(--sp-3); margin-bottom:11px}
.slider .row .lbl{flex:1; min-width:0; line-height:1.35}
.slider .row span:last-child{flex:none; font-size:var(--fs-md); font-weight:650;
  color:var(--text); line-height:1.1}
input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:5px;
  border-radius:3px; background:var(--border); outline:none; cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px;
  border-radius:50%; background:var(--info); cursor:pointer; border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--border-strong)}
input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%;
  background:var(--info); cursor:pointer; border:3px solid var(--panel)}
input[type=range]:focus-visible{outline:2px solid var(--info); outline-offset:4px}

/* ---------- diag strip ----------
   One panel divided into cells rather than seven floating cards: the row
   reads as a single instrument cluster, and the dividers do the separating
   work that seven sets of borders were doing badly. */
.diag{grid-area:diag; display:grid; grid-template-columns:repeat(7,1fr);
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card);
  overflow:hidden}
.tile{padding:var(--sp-3) var(--sp-4); position:relative; min-width:0}
.tile+.tile{border-left:1px solid var(--border-soft)}
.tile .v{font-size:var(--fs-lg); font-weight:650; margin-top:3px; line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* state is carried by a top accent rule + the value colour, not a full border,
   so an alarming tile doesn't fight the strip's own edges */
.tile::before{content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:transparent}
.tile.ok .v{color:var(--clear)}
.tile.warn::before{background:var(--confirm)}
.tile.warn .v{color:var(--confirm)}
.tile.warn{background:color-mix(in oklab,var(--confirm) 7%,transparent)}
.tile.alarm::before{background:var(--blocked)}
.tile.alarm .v{color:var(--blocked)}
.tile.alarm{background:color-mix(in oklab,var(--blocked) 10%,transparent)}

/* ---------- log ---------- */
#log{max-height:200px; overflow-y:auto; font-size:var(--fs-sm); margin:0 calc(var(--sp-4) * -1);
  padding:0 var(--sp-4); scrollbar-width:thin; scrollbar-color:var(--border) transparent}
#log::-webkit-scrollbar{width:9px}
#log::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;
  border:2px solid var(--panel)}
#log div{display:flex; gap:var(--sp-3); padding:5px 0; border-bottom:1px solid var(--border-soft)}
#log div:last-child{border-bottom:0}
#log .t{color:var(--text-mute); flex:none; font-size:var(--fs-lbl)}
#log .info{color:var(--text-2)} #log .ok{color:var(--clear)}
#log .warn{color:var(--confirm)} #log .error{color:var(--blocked); font-weight:600}

/* ---------- modal ---------- */
#modal{position:fixed; inset:0; background:rgba(4,6,10,.82); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:50; padding:var(--sp-4)}
#modal.show{display:flex}
.mbox{width:min(500px,94vw); padding:var(--sp-5); border-radius:var(--r-card);
  background:var(--panel); border:1px solid color-mix(in oklab,var(--blocked) 55%,var(--border));
  border-top:3px solid var(--blocked);
  box-shadow:0 28px 70px -14px rgba(0,0,0,.72)}
.mbox h3{margin:0 0 var(--sp-3); font-size:var(--fs-xl); font-weight:750; line-height:1.2;
  display:flex; align-items:center; gap:var(--sp-3)}
.mbox h3 svg{width:24px;height:24px;color:var(--blocked); flex:none}
.mbox p{color:var(--text-2); font-size:var(--fs-base); line-height:1.65; margin:0 0 var(--sp-5)}
.mrow{display:flex; gap:var(--sp-3)}
/* button.act sets width:100%, which fights flex sizing here -- without this
   reset the Cancel button claims nearly the whole row and Hold gets crushed
   into a sliver, clipping its text (the bug reported: "old t / onfir"). */
.mrow button.act{flex:1; width:auto; justify-content:center; white-space:nowrap;
  min-height:46px; padding:12px var(--sp-3)}
.hold{position:relative; overflow:hidden; flex-direction:column; gap:2px !important}
.hold .bar{position:absolute; inset:0; background:var(--blocked); width:0;
  transition:width 60ms linear; opacity:.5}
.hold span{position:relative; z-index:1}
.hold .sub{font-size:var(--fs-micro); font-weight:600; color:var(--text-2);
  letter-spacing:.03em; text-transform:none}
.hold.danger span:first-of-type{color:var(--text)}

/* ---------- coarse pointers: every target to 48px ---------- */
@media (pointer:coarse){
  :root{--hit:48px}
  .chip{height:40px; padding:0 14px}
  .seg button{font-size:var(--fs-sm)}
  input[type=range]{height:8px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
  input[type=range]::-moz-range-thumb{width:26px;height:26px}
  .tog .sw{width:44px;height:26px}
  .tog .sw::after{width:22px;height:22px}
  .tog.on .sw::after{transform:translateX(18px)}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition-duration:0ms !important}
  /* the two flashing safety cues are the whole point of those elements, so
     they get a static high-contrast substitute rather than simply vanishing */
  #alertPerson{background:color-mix(in oklab,var(--blocked) 42%,var(--panel)) !important;
    outline:3px solid var(--blocked); outline-offset:-3px}
  body:has(#alertPerson.show) #pageAlert{
    box-shadow:inset 0 0 0 6px var(--blocked) !important}
  .lane[data-state=confirming] .lane-icon{outline:2px dashed var(--confirm);
    outline-offset:3px; border-radius:50%}
}

/* ---------- responsive ----------
   1150: single column, side column above the feed (lane state outranks video).
    820: diag strip wraps to 4 then 2 columns, lane meters keep full width.
    560: header stacks, override buttons stay full-height and readable. */
@media (max-width:1400px){
  .diag{grid-template-columns:repeat(4,1fr)}
  .tile:nth-child(4n+1){border-left:0}
  .tile:nth-child(n+5){border-top:1px solid var(--border-soft)}
}
@media (max-width:1150px){
  /* Single column, and the lane cards move ABOVE the video: on a tablet or
     phone the lane state is what's being checked, the feed is confirmation.
     height must be released here -- html,body{height:100%} gives the grid a
     definite height, which compresses these auto rows to fit the viewport
     instead of letting them size to content, and the side column's ~590px of
     lane cards then overflowed on top of the feed and the diag strip. */
  html{height:auto}
  body{height:auto; min-height:100%; overflow:visible;
    grid-template-columns:1fr; grid-template-rows:repeat(6,auto);
    grid-template-areas:"head" "safety" "alert" "side" "feed" "diag"}
  .side{overflow:visible; min-height:0}
}
@media (max-width:820px){
  .diag{grid-template-columns:repeat(2,1fr)}
  .tile:nth-child(n){border-left:0; border-top:1px solid var(--border-soft)}
  .tile:nth-child(2n){border-left:1px solid var(--border-soft)}
  .tile:nth-child(-n+2){border-top:0}
  .lane-state{font-size:30px}
}
@media (max-width:560px){
  body{padding:var(--sp-2); gap:var(--sp-2)}
  header{padding:var(--sp-3)}
  header h1{border-right:0; padding-right:0; width:100%}
  .chipbar{justify-content:flex-start}
  .chipdiv{display:none}
  .grid2{grid-template-columns:1fr}
  .lane-actions .seg{flex-direction:column}
  .seg button+button{border-left:0; border-top:1px solid var(--border-soft)}
  #alertPerson{font-size:var(--fs-md)}
}
</style>
</head>
<body>

<!-- decorative page-level escalation; no script references this element -->
<div id="pageAlert" aria-hidden="true"></div>

<header>
  <h1><i data-i="radio"></i> LANE MONITOR</h1>
  <div class="chipbar">
    <span class="chip" id="chipCal" style="display:none"><i data-i="crosshair"></i><span>calibrating</span></span>
    <span class="chip" id="chipModel"><i data-i="cpu"></i><span>model</span></span>
    <span class="chip" id="chipSerial"><i data-i="cable"></i><span>serial</span></span>
    <span class="chip" id="chipCmd"><i data-i="radio"></i><span>cmd</span></span>
    <span class="chip" id="chipLed" title="Not the same thing as 'cmd' -- cmd is what the dashboard SENT, this is what the ESP32 itself reports it actually applied. The firmware echoes every command it receives, so a write() that succeeds doesn't get trusted blindly."><i data-i="circle-check"></i><span>LED</span></span>
    <span class="chip" id="chipShift" title="Tracks the lane-boundary corners frame to frame and warps a bumped camera back into alignment automatically. 'shift-safe: off' means no corner_ref.json yet -- recapture the baseline to build one."><i data-i="crosshair"></i><span>shift-safe</span></span>
    <span class="chipdiv" aria-hidden="true"></span>
    <span class="chip" id="chipMute" onclick="toggleMute()" title="Mutes this browser's alarm beeps only — the banners, the log, and the physical LEDs are unaffected"><i data-i="zap"></i><span>alarm sound</span></span>
    <button class="chip" onclick="testSounds()"
            title="Preview both alert sounds right now, regardless of mute">Test</button>
  </div>
</header>

<div id="safety">
  <div class="safety-banner" id="alertSupervisor"><i data-i="triangle-alert"></i><span id="alertSupervisorText"></span></div>
  <div class="safety-banner" id="alertPerson"><i data-i="zap"></i><span id="alertPersonText"></span></div>
</div>

<div id="alert"><i data-i="triangle-alert"></i><span id="alertText"></span></div>

<div class="feed">
  <img id="feed" src="/stream.mjpg" alt="live camera">
  <canvas id="calibLayer"></canvas>
  <div id="feedLost"><i data-i="octagon-x"></i><span>FEED LOST</span></div>
  <div class="feedbar" id="calibBar" style="display:none">
    <span class="lbl" id="calibHint"></span>
    <span class="spacer"></span>
    <button class="act" style="width:auto" onclick="calibUndo()"><i data-i="rotate-ccw"></i>Undo</button>
    <button class="act primary" style="width:auto" onclick="calibSave()"><i data-i="save"></i>Save lanes</button>
    <button class="act" style="width:auto" onclick="calibStop()"><i data-i="octagon-x"></i>Cancel</button>
  </div>
</div>

<div class="side">
  <div id="lanes"></div>

  <details class="panel adv" id="advPanel">
    <summary><i data-i="sliders-horizontal"></i>Advanced</summary>
    <div class="advBody">

      <div class="sect">
        <h2>Recovery</h2>
        <div class="stack">
          <button class="act primary" onclick="act('relearn')"><i data-i="refresh-cw"></i>Unstick — relearn current scene</button>
          <button class="act" onclick="act('reset_model')"><i data-i="rotate-ccw"></i>Reset model from saved baseline</button>
          <button class="act danger" onclick="rebaseline()"><i data-i="scan-line"></i>Re-capture baseline (90 frames)</button>
        </div>
      </div>

      <div class="sect">
        <h2>Calibration &amp; capture</h2>
        <div class="grid2">
          <button class="act" onclick="calibStart()"><i data-i="crosshair"></i>Draw lanes</button>
          <button class="act" onclick="act('calib_auto',{split:'lr'})"><i data-i="scan-line"></i>Auto split</button>
          <button class="act" onclick="act('snapshot')"><i data-i="image-down"></i>Snapshot</button>
          <button class="act" onclick="openPorts()"><i data-i="cable"></i>Serial…</button>
        </div>
      </div>

      <div class="sect">
        <h2>View &amp; pipeline</h2>
        <div id="toggles"></div>
      </div>

      <div class="sect">
        <h2>Tuning</h2>
        <div id="sliders"></div>
      </div>

      <div class="sect">
        <h2 style="display:flex;align-items:center;gap:8px"><i data-i="list" style="width:13px;height:13px"></i>Event log</h2>
        <div id="log"></div>
      </div>

    </div>
  </details>
</div>

<div class="diag" id="diag"></div>

<div id="modal"><div class="mbox">
  <h3><i data-i="triangle-alert"></i><span id="mTitle"></span></h3>
  <p id="mBody"></p>
  <div class="mrow">
    <button class="act" style="justify-content:center" onclick="closeModal()">Cancel</button>
    <button class="act danger hold" id="mHold" style="justify-content:center">
      <span class="bar"></span><span id="mHoldText">Hold to confirm</span>
    </button>
  </div>
</div></div>

<script>
let ICONS={}, S=null, calib=null;
let lastStateTs=null, lastStateChangeAt=Date.now(), imgErrored=false;
const STATE_STALE_MS=3000;   // generous margin above one frame interval at any sane fps

// A frozen last frame looks exactly like a working feed of a static scene --
// the most dangerous failure mode here -- so this can't just trust that the
// video element looks fine. It doesn't: for a multipart/x-mixed-replace
// MJPEG stream, the browser fires <img>'s 'load' event once, at the very
// first frame, not on every subsequent part -- measured directly against
// this dashboard's own live stream, zero 'load' events fired across 4s of
// genuinely continuous video. So a mid-stream freeze produces no event at
// all; the img would sit there "successfully loaded" forever. The real
// signal is the detector's own per-frame timestamp (s.ts) in /api/state: if
// the backend thread hangs (camera.read() blocking, say), the HTTP server
// keeps answering 200 OK with the last cached state, so a plain fetch
// success/failure check (what this used to rely on) doesn't catch it either
// -- only watching whether ts itself is still advancing does.
let fetchFailed=false;
function updateFeedLost(){
  document.getElementById("feedLost").classList.toggle("show",
    imgErrored || fetchFailed || (Date.now()-lastStateChangeAt > STATE_STALE_MS));
}
let alarmCtx=null, lastSupervisorKey="", personAlarmTimer=null;
// Single source of truth for each alert's base loudness (before the user's
// volume slider multiplies it) -- testSounds() reads these too, so the Test
// button can never silently drift out of sync with what a real alert plays,
// the way it did the first time these were tuned.
const SUP_VOL=0.20, PER_VOL=0.24;

// Mute is per-browser (localStorage), not sent to the server: it silences
// what THIS viewer hears, same way the alarm itself was already per-viewer.
// It never touches the banners, the event/alert log, or the physical LEDs --
// those stay true to what the detector actually decided. Wrapped in
// try/catch because a private window or blocked site data can throw on
// access, and muting must never crash rendering because of that.
function isMuted(){
  try{ return localStorage.getItem("alarmMuted")==="1"; }catch(e){ return false; }
}
function setMuted(v){
  try{ localStorage.setItem("alarmMuted", v?"1":"0"); }catch(e){}
  const chip=document.getElementById("chipMute");
  chip.className="chip "+(v?"off":"on");
  chip.lastElementChild.textContent=v?"alarm muted":"alarm sound";
}
function toggleMute(){ setMuted(!isMuted()); }

// Web Audio, not <audio> tags: no asset to ship, and a square-wave beep
// reads as an alarm rather than a notification chime. Browsers require a
// user gesture before audio can play -- see the pointerdown listener near
// the bottom of this script, which unlocks it on the operator's first click
// so it's ready by the time a real alarm fires.
function ensureAudio(){
  if(!alarmCtx){
    try{ alarmCtx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(alarmCtx.state==="suspended") alarmCtx.resume().catch(()=>{});
  return alarmCtx;
}
// Sine, not square: a square wave is all harsh odd harmonics, which is why
// the original beep read as an alarm klaxon rather than a notification. A
// soft attack/decay envelope on the gain matters just as much as the
// waveform -- switching an oscillator on/off at full volume produces an
// audible click at both edges no matter what shape the wave is. Volume is
// fixed (SUP_VOL/PER_VOL above) -- there was a live user-adjustable slider
// here, removed once the level was settled on, so it can't drift again.
// `force` bypasses mute (only the Test button uses it) without touching the
// persisted mute setting.
function tone(freq, ms, vol, type, force){
  if(isMuted() && !force) return;
  const ctx=ensureAudio(); if(!ctx) return;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type||"sine"; osc.frequency.value=freq;
  const t0=ctx.currentTime, dur=ms/1000, peak=vol==null?0.15:vol;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(peak,0.0001), t0+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

let personAlarmHigh=false;

// Supervisor banner: chimes once per NEW alert (edge-triggered on the set of
// blocked lanes), then stays silently visible until the lane clears -- it is
// a notification, not an ongoing alarm. Person-in-lane banner repeats a
// two-tone pattern for as long as the condition holds, and clears
// immediately once the lane is safe or the person leaves. Its urgency comes
// from the alternating rhythm, not from harshness -- this one is genuinely
// safety-critical and needs to stay noticeable, just not unpleasant.
function updateSafety(s){
  const sup=(s.alerts&&s.alerts.supervisor)||[];
  const supEl=document.getElementById("alertSupervisor");
  if(sup.length){
    supEl.classList.add("show");
    document.getElementById("alertSupervisorText").innerHTML=sup.map(a=>
      `<b>LANE ${a.lane}</b> obstruction detected — supervisor notified (${a.since_s}s)`
    ).join(" &nbsp;·&nbsp; ");
    const key=sup.map(a=>a.lane).sort().join(",");
    if(key!==lastSupervisorKey){ tone(659,150,SUP_VOL); setTimeout(()=>tone(880,220,SUP_VOL),140); }
    lastSupervisorKey=key;
  } else {
    supEl.classList.remove("show");
    lastSupervisorKey="";
  }

  const per=(s.alerts&&s.alerts.person)||[];
  const perEl=document.getElementById("alertPerson");
  if(per.length){
    perEl.classList.add("show");
    document.getElementById("alertPersonText").innerHTML=
      `<b>PERSON ON BLOCKED LANE ${per.join(", ")}</b> — clear the walkway immediately`;
    if(!personAlarmTimer){
      personAlarmHigh=false;
      personAlarmTimer=setInterval(()=>{
        tone(personAlarmHigh?659:494, 150, PER_VOL);
        personAlarmHigh=!personAlarmHigh;
      }, 550);
    }
  } else {
    perEl.classList.remove("show");
    if(personAlarmTimer){ clearInterval(personAlarmTimer); personAlarmTimer=null; }
  }
}

/* Inline SVG (Lucide, ISC) rather than <img> icons: they inherit currentColor,
   so an icon recolours with its lane's state for free, and stay crisp at any
   size with no extra network requests. */
function svg(name,cls){
  const inner=ICONS[name]||"";
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
function paintIcons(root){
  (root||document).querySelectorAll("i[data-i]").forEach(el=>{
    el.outerHTML=svg(el.dataset.i, el.className);
  });
}
const fmtUp=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
  return h?`${h}h ${String(m).padStart(2,"0")}m`:m?`${m}m ${String(x).padStart(2,"0")}s`:`${x}s`;};

async function act(action,params={}){
  const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,params})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok && j.needs_force) confirmModal("Lane is currently BLOCKED",j.error+
      " Continue only if you have physically verified both lanes are empty.",
      ()=>act("recapture_baseline",{force:true}));
  else if(!r.ok) alert(j.error||"action failed");
  return j;
}

/* ---- guarded actions ---- */
let holdTimer=null;
function confirmModal(title,body,onConfirm){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mBody").textContent=body;
  document.getElementById("modal").classList.add("show");
  const btn=document.getElementById("mHold"), bar=btn.querySelector(".bar");
  let t=0;
  const start=()=>{ // hold-to-confirm: a click-through-able dialog gets ignored within a day
    clearInterval(holdTimer);
    holdTimer=setInterval(()=>{ t+=60; bar.style.width=(t/1200*100)+"%";
      if(t>=1200){clearInterval(holdTimer); bar.style.width="0"; closeModal(); onConfirm();}},60);
  };
  const stop=()=>{clearInterval(holdTimer); t=0; bar.style.width="0";};
  btn.onmousedown=start; btn.onmouseup=stop; btn.onmouseleave=stop;
  btn.ontouchstart=e=>{e.preventDefault();start();}; btn.ontouchend=stop;
}
function closeModal(){clearInterval(holdTimer);document.getElementById("modal").classList.remove("show");}
function rebaseline(){
  confirmModal("Re-capture baseline",
    "This records the CURRENT view as 'normal'. Anything sitting in a lane right now "+
    "becomes invisible to the detector permanently. Make sure both lanes are physically empty.",
    ()=>act("recapture_baseline"));
}
function setOverride(lane,mode){
  if(mode==="green"){
    confirmModal("Force LANE "+lane+" CLEAR",
      "This overrides the detector and shows GREEN to drivers even if an obstruction is present. "+
      "It expires automatically after 5 minutes. Only do this if you can see the lane is clear.",
      ()=>act("override",{lane,mode,confirmed:true}));
  } else act("override",{lane,mode});
}

/* ---- browser lane calibration ---- */
function calibStart(){
  calib={lane:"A",pts:{A:[],B:[]}};
  document.getElementById("calibLayer").classList.add("on");
  document.getElementById("calibBar").style.display="flex";
  document.getElementById("chipCal").style.display="inline-flex";
  drawCalib();
}
function calibStop(){
  calib=null;
  document.getElementById("calibLayer").classList.remove("on");
  document.getElementById("calibBar").style.display="none";
  document.getElementById("chipCal").style.display="none";
}
function calibUndo(){ if(calib&&calib.pts[calib.lane].length) calib.pts[calib.lane].pop(); drawCalib(); }
function calibSave(){
  if(!calib) return;
  if(calib.pts.A.length!==4||calib.pts.B.length!==4){alert("Each lane needs exactly 4 corners.");return;}
  act("calib_set",{lanes:calib.pts}); calibStop();
}
document.getElementById("calibLayer").addEventListener("click",e=>{
  if(!calib) return;
  const c=e.currentTarget, r=c.getBoundingClientRect();
  const img=document.getElementById("feed");
  // map click -> normalised image coords, accounting for object-fit:contain letterboxing
  const ar=(img.naturalWidth||4)/(img.naturalHeight||3), br=r.width/r.height;
  let w=r.width,h=r.height,ox=0,oy=0;
  if(br>ar){w=r.height*ar; ox=(r.width-w)/2;} else {h=r.width/ar; oy=(r.height-h)/2;}
  const x=(e.clientX-r.left-ox)/w, y=(e.clientY-r.top-oy)/h;
  if(x<0||x>1||y<0||y>1) return;
  const cur=calib.pts[calib.lane];
  if(cur.length<4) cur.push([x,y]);
  if(cur.length===4&&calib.lane==="A") calib.lane="B";
  drawCalib();
});
function drawCalib(){
  const c=document.getElementById("calibLayer"); if(!calib) return;
  const r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height;
  const img=document.getElementById("feed");
  const ar=(img.naturalWidth||4)/(img.naturalHeight||3), br=r.width/r.height;
  let w=r.width,h=r.height,ox=0,oy=0;
  if(br>ar){w=r.height*ar; ox=(r.width-w)/2;} else {h=r.width/ar; oy=(r.height-h)/2;}
  const g=c.getContext("2d"); g.clearRect(0,0,c.width,c.height);
  for(const [lane,col] of [["A","#12D18C"],["B","#5B9DFF"]]){
    const pts=calib.pts[lane]; if(!pts.length) continue;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=2.5; g.beginPath();
    pts.forEach(([x,y],i)=>{const px=ox+x*w,py=oy+y*h; i?g.lineTo(px,py):g.moveTo(px,py);});
    if(pts.length===4) g.closePath();
    g.stroke();
    pts.forEach(([x,y],i)=>{const px=ox+x*w,py=oy+y*h;
      g.beginPath(); g.arc(px,py,7,0,7); g.fill();
      g.fillStyle="#070A0F"; g.font="bold 11px system-ui"; g.textAlign="center";
      g.fillText(i+1,px,py+4); g.fillStyle=col;});
  }
  document.getElementById("calibHint").textContent=
    `LANE ${calib.lane} — click ${4-calib.pts[calib.lane].length} more corner(s)`;
}

async function openPorts(){
  const j=await (await fetch("/api/ports")).json();
  const list=(j.ports||[]).map(p=>`${p.device}${p.espressif?"  (ESP32)":""} — ${p.desc}`).join("\n")||"none found";
  const pick=prompt("Serial ports:\n\n"+list+"\n\nEnter port (blank = disconnect):","");
  if(pick===null) return;
  if(pick.trim()) act("serial_connect",{port:pick.trim()}); else act("serial_disconnect");
}

/* ---- render ---- */
const STATE_ICON={clear:"circle-check",confirming:"triangle-alert",blocked:"octagon-x"};
function laneState(L){return L.blocked?"blocked":(L.occupied||L.credit>0.2)?"confirming":"clear";}

function render(s){
  S=s;
  if(s.status!=="running"){document.getElementById("alertText").innerHTML="<b>"+(s.error||s.status)+"</b>";
    document.getElementById("alert").classList.add("show");
    updateSafety({}); return;}

  updateSafety(s);

  // lanes
  const box=document.getElementById("lanes");
  const names=Object.keys(s.lanes).sort();
  if(box.children.length!==names.length){
    box.innerHTML=names.map(n=>`<div class="lane" id="lane${n}" style="margin-bottom:12px"></div>`).join("");
  }
  names.forEach(n=>{
    const L=s.lanes[n], st=laneState(L), el=document.getElementById("lane"+n);
    el.dataset.state=st;
    const pct=Math.min(L.credit/L.block_seconds*100,100);
    const rel=L.release_seconds/L.block_seconds*100;
    const blobPct=Math.min(L.blob/Math.max(L.need,1)*100,100);
    const exp=(s.override_expires||{})[n];
    el.innerHTML=`
      <div class="lane-top">
        <div class="lane-badge">${svg(STATE_ICON[st],"lane-icon")}</div>
        <div class="lane-id"><div class="lane-name">LANE ${n}</div>
             <div class="lane-state">${st==="confirming"?"CONFIRMING":st.toUpperCase()}</div></div>
        ${L.override!=="auto"?`<span class="ovr ${L.override==="green"?"green":""}">
            ${L.override==="green"?"FORCED CLEAR":"FORCED RED"}${exp?" "+Math.ceil(exp)+"s":""}</span>`:""}
      </div>
      <div class="meter">
        <div class="meter-head"><span class="lbl">confirmation</span>
          <span class="v num">${L.credit.toFixed(1)} / ${L.block_seconds.toFixed(1)}s</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div>
          <div class="ticks"></div><div class="release" style="left:${rel}%"></div></div>
        <div class="meter-foot"><span>release ${L.release_seconds.toFixed(1)}s</span>
          <span>${st==="blocked"?"draining to release":"→ BLOCKED at "+L.block_seconds.toFixed(1)+"s"}</span></div>
        <div class="track2"><div class="fill2" style="width:${blobPct}%"></div></div>
        <div class="meter-foot"><span class="num">blob ${L.blob} / ${L.need} px</span>
          <span class="num">${L.pct_of_need}% of threshold</span></div>
      </div>
      <div class="lane-actions"><div class="seg">
        ${["auto","red","green"].map(m=>`<button data-mode="${m}" class="${L.override===m?"sel":""}"
           onclick="setOverride('${n}','${m}')">${m==="auto"?"AUTO":m==="red"?"FORCE RED":"FORCE CLEAR"}</button>`).join("")}
      </div></div>`;
  });

  // chips
  const cs=document.getElementById("chipSerial");
  cs.className="chip "+(s.serial?"on":"off");
  cs.lastElementChild.textContent=s.serial?s.serial:"no serial";
  const cm=document.getElementById("chipModel");
  cm.className="chip "+(s.frozen?"warn":"on");
  cm.lastElementChild.textContent=s.frozen?"model frozen":(s.yolo?"MOG2 + YOLO":"MOG2");
  const cc=document.getElementById("chipCmd");
  cc.className="chip "+(s.cmd==="0"?"on":"warn");
  cc.lastElementChild.textContent=`cmd ${s.cmd} · ${s.cmd_text}`;
  const cl=document.getElementById("chipLed");
  if(!s.serial){ cl.className="chip off"; cl.lastElementChild.textContent="LED n/a"; }
  else{ cl.className="chip "+(s.led_confirmed?"on":"warn");
        cl.lastElementChild.textContent=s.led_confirmed?"LED confirmed":"LED UNCONFIRMED"; }
  const cx=document.getElementById("chipShift");
  cx.className="chip "+(s.shift_correction==="active"?"warn":
                        s.shift_correction==="armed"?"on":"off");
  cx.lastElementChild.textContent=s.shift_correction==="active"?"shift correcting":
                        s.shift_correction==="armed"?"shift-safe":"shift-safe: off";

  // alert band
  let msg="";
  if(s.baseline_progress!=null) msg=`<b>Capturing baseline ${s.baseline_progress}/90</b> — keep both lanes clear.`;
  else if(s.likely_moved) msg=`<b>Camera may have moved.</b> ${s.aligned_shift}% of the frame still differs after exposure alignment — that is geometric, not lighting. Re-draw the lanes rather than re-baselining.`;
  else if(s.frame_change>50) msg=`<b>${s.frame_change}% of the frame changed.</b> Baseline is likely stale — try Unstick, then Re-capture baseline.`;
  else if(Object.values(s.lanes).some(l=>l.override!=="auto")) msg=`<b>Manual override active.</b> A lane is not being driven by the detector.`;
  document.getElementById("alert").classList.toggle("show",!!msg);
  if(msg) document.getElementById("alertText").innerHTML=msg;

  // diag tiles
  const chg=s.frame_change;
  document.getElementById("diag").innerHTML=[
    ["fps",s.fps.toFixed(1),s.fps<5?"warn":"ok"],
    ["uptime",fmtUp(s.uptime),""],
    ["serial",s.serial||"—",s.serial?"ok":"warn"],
    ["command",s.cmd,s.cmd==="0"?"ok":"alarm"],
    ["frame change",chg+"%",chg>50?"alarm":chg>35?"warn":"ok"],
    ["shadow px",s.shadow_px,""],
    ["model",s.frozen?"FROZEN":"learning",s.frozen?"warn":"ok"],
  ].map(([l,v,c])=>`<div class="tile ${c}"><div class="lbl">${l}</div><div class="v num">${v}</div></div>`).join("");

  // toggles
  const tg=document.getElementById("toggles");
  const defs=[["shadow_reject","Reject shadows"],["use_yolo","Vehicle subtraction (YOLO)"],
              ["photometric","Exposure alignment"],["show_mask","Show detection mask"]];
  tg.innerHTML=defs.map(([k,label])=>`<div class="tog ${s.params[k]?"on":""}"
      onclick="act('toggle',{name:'${k}'})"><span>${label}</span><span class="sw"></span></div>`).join("");

  // sliders
  const sl=document.getElementById("sliders");
  if(!sl.dataset.built){
    sl.dataset.built="1";
    sl.innerHTML=[
      ["block_seconds","Confirm before BLOCKED","s",2,20,0.5],
      ["release_seconds","Release threshold","s",0.5,10,0.5],
      ["blob_px","Object size threshold","px",200,4000,50],
    ].map(([k,label,unit,mn,mx,stp])=>`<div class="slider">
        <div class="row"><span class="lbl">${label}</span><span class="num" id="sv_${k}"></span></div>
        <input type="range" id="s_${k}" min="${mn}" max="${mx}" step="${stp}"
          oninput="document.getElementById('sv_${k}').textContent=this.value+'${unit}'"
          onchange="act('set_param',{name:'${k}',value:parseFloat(this.value)})"></div>`).join("");
  }
  ["block_seconds","release_seconds","blob_px"].forEach(k=>{
    const i=document.getElementById("s_"+k);
    if(document.activeElement!==i){i.value=s.params[k];
      document.getElementById("sv_"+k).textContent=s.params[k]+(k==="blob_px"?"px":"s");}
  });

  // log
  document.getElementById("log").innerHTML=(s.events||[]).map(e=>{
    const d=new Date(e.t*1000).toTimeString().slice(0,8);
    return `<div><span class="t num">${d}</span><span class="${e.level}">${e.text}</span></div>`;}).join("");

  if(s.ts!==lastStateTs){ lastStateTs=s.ts; lastStateChangeAt=Date.now(); }
  updateFeedLost();
}

// Still a real, separate signal worth keeping: the <img> resource itself
// failing to load at all (bad URL, server down before ever starting).
// 'load' is deliberately NOT wired here any more -- see updateFeedLost()'s
// comment above for why it doesn't mean what it sounds like it means.
document.getElementById("feed").addEventListener("error",()=>{
  imgErrored=true; updateFeedLost();
});

async function poll(){
  try{
    const s = await (await fetch("/api/state")).json();
    fetchFailed=false;
    render(s);
  } catch(e){ fetchFailed=true; updateFeedLost(); }
}
setMuted(isMuted());   // paint the chip's actual starting state, not a blank one
// Bypasses mute (force=true) so Test always demonstrates the actual sound,
// without silently un-muting a deliberate choice or requiring a real alert.
function testSounds(){
  tone(659,150,SUP_VOL,"sine",true);
  setTimeout(()=>tone(880,220,SUP_VOL,"sine",true),140);
  setTimeout(()=>{
    let n=0;
    const iv=setInterval(()=>{
      tone(n%2?659:494,150,PER_VOL,"sine",true);
      if(++n>=4) clearInterval(iv);
    },550);
  },900);
}
document.addEventListener("pointerdown", ()=>ensureAudio(), {once:true});
fetch("/icons.json").then(r=>r.json()).then(j=>{ICONS=j; paintIcons(); poll(); setInterval(poll,400);});
window.addEventListener("resize",()=>{if(calib) drawCalib();});
</script>
</body>
</html>
